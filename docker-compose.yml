services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/analytics.db
      - STATIC_PATH=./static
      - CORS_ORIGIN=*
    volumes:
      - analytics-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "--eval", "fetch('http://localhost:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Development service with hot reload
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "4321:4321"  # Astro dev server
      - "3001:3001"  # API dev server
    environment:
      - NODE_ENV=development
      - DATABASE_PATH=/app/data/analytics.db
    volumes:
      - .:/app
      - /app/node_modules
      - analytics-data:/app/data
    command: bun run dev
    profiles:
      - dev

volumes:
  analytics-data:
