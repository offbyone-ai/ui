name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to production'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

  build:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Setup Caddy (if not exists)
        run: |
          ssh root@${{ secrets.SERVER_HOST }} << 'EOF'
            # Create shared Docker network (if not exists)
            docker network create web 2>/dev/null || true

            # Setup Caddy if not already running
            if [ ! -f /opt/caddy/docker-compose.yml ]; then
              echo "Setting up Caddy..."
              mkdir -p /opt/caddy

              cat > /opt/caddy/Caddyfile << 'CADDYFILE'
            ui.offbyone.ai {
                reverse_proxy offbyone-ui:3000
            }
            CADDYFILE

              cat > /opt/caddy/docker-compose.yml << 'COMPOSE'
            services:
              caddy:
                image: caddy:2-alpine
                container_name: caddy
                ports:
                  - "80:80"
                  - "443:443"
                volumes:
                  - ./Caddyfile:/etc/caddy/Caddyfile:ro
                  - caddy_data:/data
                  - caddy_config:/config
                networks:
                  - web
                restart: unless-stopped

            networks:
              web:
                external: true

            volumes:
              caddy_data:
              caddy_config:
            COMPOSE

              cd /opt/caddy && docker compose up -d
              echo "Caddy setup complete!"
            else
              echo "Caddy already configured"
            fi
          EOF

      - name: Deploy to server
        run: |
          ssh root@${{ secrets.SERVER_HOST }} << 'EOF'
            # Update app docker-compose to use web network
            cat > /opt/offbyone/docker-compose.yml << 'COMPOSE'
            services:
              app:
                image: ghcr.io/offbyone-ai/ui:latest
                container_name: offbyone-ui
                restart: unless-stopped
                expose:
                  - "3000"
                environment:
                  - NODE_ENV=production
                  - DATABASE_PATH=/app/data/analytics.db
                  - STATIC_PATH=./static
                volumes:
                  - ./data:/app/data
                networks:
                  - web
                healthcheck:
                  test: ["CMD", "bun", "--eval", "fetch('http://localhost:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1))"]
                  interval: 30s
                  timeout: 10s
                  retries: 3
                  start_period: 10s

            networks:
              web:
                external: true
            COMPOSE

            cd /opt/offbyone
            docker compose pull
            docker compose up -d
            docker image prune -f
            echo "Deployment complete!"
          EOF

      - name: Health check
        run: |
          sleep 10
          curl -f https://ui.offbyone.ai/api/health || exit 1
          echo "Health check passed!"
