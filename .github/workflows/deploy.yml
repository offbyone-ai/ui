name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to production'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

  build:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Setup Caddy (if not exists)
        run: |
          # Base64 encoded Caddyfile
          CADDYFILE_B64="dWkub2ZmYnlvbmUuYWkgewogICAgcmV2ZXJzZV9wcm94eSBvZmZieW9uZS11aTozMDAwCn0K"

          # Base64 encoded Caddy docker-compose.yml
          CADDY_COMPOSE_B64=""

          ssh root@${{ secrets.SERVER_HOST }} "
            set -e
            docker network create web 2>/dev/null || true

            if [ ! -f /opt/caddy/docker-compose.yml ]; then
              echo 'Setting up Caddy...'
              mkdir -p /opt/caddy
              echo '$CADDYFILE_B64' | base64 -d > /opt/caddy/Caddyfile
              echo '$CADDY_COMPOSE_B64' | base64 -d > /opt/caddy/docker-compose.yml
              cd /opt/caddy && docker compose up -d
              echo 'Caddy setup complete!'
            else
              echo 'Caddy already configured'
            fi
          "

      - name: Deploy to server
        run: |
          # Base64 encoded app docker-compose.yml
          APP_COMPOSE_B64=""

          ssh root@${{ secrets.SERVER_HOST }} "
            set -e
            echo '$APP_COMPOSE_B64' | base64 -d > /opt/offbyone/docker-compose.yml
            cd /opt/offbyone
            docker compose pull
            docker compose up -d
            docker image prune -f
            echo 'Deployment complete!'
          "

      - name: Health check
        run: |
          sleep 10
          curl -f https://ui.offbyone.ai/api/health || exit 1
          echo "Health check passed!"
